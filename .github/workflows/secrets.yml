name: Secret scan
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: secrets-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks
        id: install
        continue-on-error: true
        run: |
          curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan all history and archived evidence with redacted output
        if: steps.install.outcome == 'success'
        run: /tmp/gitleaks git --redact=100 --no-banner --log-opts=--all --max-archive-depth 8 --max-decode-depth 4 .
      - name: Scan with the digest-pinned container image when the release download is unavailable
        if: steps.install.outcome != 'success'
        run: |
          echo "Release asset download failed; falling back to ghcr.io/gitleaks/gitleaks:v8.30.1 pinned by digest."
          docker run --rm -v "$PWD:/repo" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact=100 --no-banner --log-opts=--all --max-archive-depth 8 --max-decode-depth 4 .
