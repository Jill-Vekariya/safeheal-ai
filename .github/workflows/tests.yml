name: tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - name: Compare fixed robustness cases against exact Day 7 source
        run: python scripts/compare_robustness.py --output-dir .local/day8-paired
      - name: Replay retained benchmark with read-only diagnosis fallback
        run: python scripts/diagnose.py --output .local/day6-replay.json benchmark evidence/day5/ci-39774736343/run-03a9072a24f8
      - name: Replay retained controlled experiment measurements
        run: python scripts/analyze_controlled.py evidence/day9/run-primary --output .local/day9-replay --no-plots
      - name: Replay configured local-model cohort
        run: python scripts/analyze_controlled.py evidence/day9/run-local-20261025 --output .local/day9-local-replay --no-plots
      - name: Verify final artifacts and read-only audit replay
        run: python scripts/reproduce.py --output .local/final-replay
      - name: Preserve diagnosis and experiment replays
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day6-diagnosis-replay
          path: |
            .local/day6-replay.json
            .local/day8-paired/
            .local/day9-replay/
            .local/day9-local-replay/
            .local/final-replay/
          retention-days: 7
  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install detector runtime
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Install pinned project-local kind
        run: python scripts/k8s.py install-kind
      - name: Create isolated kind cluster
        run: python scripts/k8s.py setup
      - name: Deploy and validate manifests
        run: python scripts/k8s.py deploy
      - name: Verify real service discovery and HTTP calls
        run: python scripts/k8s.py verify
      - name: Check dry-run then native container recovery
        run: |
          python scripts/k8s.py recovery
          python scripts/k8s.py recovery --execute
      - name: Verify independent allowlisted recovery and approval gates
        run: |
          python scripts/verify_recovery.py
          python scripts/verify_recovery.py --execute --mode autonomous
          python scripts/verify_recovery.py --execute --mode approval
      - name: Deploy observability and verify actual traffic, dashboards and traces
        run: |
          python scripts/observe.py deploy
          python scripts/observe.py verify
      - name: Verify deterministic incidents with real Prometheus and a scoped payment task failure
        run: |
          kubectl --kubeconfig .local/kubeconfig --context kind-safeheal-dev -n safeheal-dev port-forward --address=127.0.0.1 service/prometheus 19090:9090 > .local/day4-prometheus-forward.log 2>&1 &
          detector_forward_pid=$!
          trap 'kill "$detector_forward_pid" 2>/dev/null || true' EXIT
          python scripts/verify_detector_pause.py
          python scripts/verify_detector_pause.py --execute
      - name: Repeat three labelled faults and record native and rule baselines
        run: |
          python scripts/benchmark.py run
          python scripts/benchmark.py run --execute --backend kubernetes --repeats 2 --baseline-seconds 30
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-observability-evidence
          path: |
            evidence/day2/
            evidence/day3/
            evidence/day4/
            evidence/day5/
            evidence/day7/
          retention-days: 7
