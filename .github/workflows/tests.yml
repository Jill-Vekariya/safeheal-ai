name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned project-local kind
        run: python scripts/k8s.py install-kind
      - name: Create isolated kind cluster
        run: python scripts/k8s.py setup
      - name: Deploy and validate manifests
        run: python scripts/k8s.py deploy
      - name: Verify real service discovery and HTTP calls
        run: python scripts/k8s.py verify
      - name: Check dry-run then native container recovery
        run: |
          python scripts/k8s.py recovery
          python scripts/k8s.py recovery --execute
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day2-kubernetes-evidence
          path: evidence/day2/
          retention-days: 7
