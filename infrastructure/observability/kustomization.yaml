apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: safeheal-dev
resources:
  - resources.json
configMapGenerator:
  - name: safeheal-prometheus
    files: [prometheus.yml]
  - name: safeheal-grafana-datasources
    files: [datasources.yaml]
  - name: safeheal-grafana-providers
    files: [dashboards.yaml]
  - name: safeheal-grafana-dashboards
    files: [safeheal.json]
generatorOptions:
  labels:
    app.kubernetes.io/part-of: safeheal-ai
    safeheal.ai/project: safeheal-ai
    safeheal.ai/environment: local-test
